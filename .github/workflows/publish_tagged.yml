name: Deploy tagged

on:
  push:
    tags:
      - v*

jobs:
  get-tag:
    name: Get latest tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      latest_tag: ${{ steps.latest-tag.outputs.tag }}

    steps:
      - name: Get latest tag
        uses: oprypin/find-latest-tag@6957ac556fa6d349727ecabfcaaf9f8e5ee37124 # v1.1.3
        id: latest-tag
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}

  build-aws:
    name: Build and push latest image (w/ aws cli)
    runs-on: ubuntu-latest
    needs: get-tag
    permissions:
      id-token: write
      contents: write
      packages: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@main
        with:
          ref: ${{ needs.get-tag.outputs.latest_tag }}
          fetch-depth: 0

      - name: Build and push latest image (w/ aws cli)
        uses: ./.github/workflows/publish
        with:
          bake_target: aws,aws-fips
          aws_role_to_assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          bake_set: |
            aws.tags=${{ secrets.PUBLIC_RUNNER_OPENTOFU_ECR_REPOSITORY_URL }}:latest
            aws.tags=${{ secrets.PUBLIC_RUNNER_OPENTOFU_ECR_REPOSITORY_URL }}:${{ needs.get-tag.outputs.latest_tag }}
            aws.tags=ghcr.io/spacelift-io/runner-opentofu:latest
            aws.tags=ghcr.io/spacelift-io/runner-opentofu:${{ needs.get-tag.outputs.latest_tag }}
            aws-fips.tags=${{ secrets.PUBLIC_RUNNER_OPENTOFU_ECR_REPOSITORY_URL }}:latest-fips
            aws-fips.tags=${{ secrets.PUBLIC_RUNNER_OPENTOFU_ECR_REPOSITORY_URL }}:${{ needs.get-tag.outputs.latest_tag }}-fips
            aws-fips.tags=ghcr.io/spacelift-io/runner-opentofu:latest-fips
            aws-fips.tags=ghcr.io/spacelift-io/runner-opentofu:${{ needs.get-tag.outputs.latest_tag }}-fips

  build-gcp:
    name: Build and push latest image (w/ gcloud cli)
    runs-on: ubuntu-latest
    needs: get-tag
    permissions:
      id-token: write
      contents: write
      packages: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@main
        with:
          ref: ${{ needs.get-tag.outputs.latest_tag }}
          fetch-depth: 0

      - name: Build and push latest image (w/ gcloud cli)
        uses: ./.github/workflows/publish
        with:
          bake_target: gcp,gcp-fips
          aws_role_to_assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          bake_set: |
            gcp.tags=${{ secrets.PUBLIC_RUNNER_OPENTOFU_ECR_REPOSITORY_URL }}:gcp-latest
            gcp.tags=${{ secrets.PUBLIC_RUNNER_OPENTOFU_ECR_REPOSITORY_URL }}:gcp-${{ needs.get-tag.outputs.latest_tag }}
            gcp.tags=ghcr.io/spacelift-io/runner-opentofu:gcp-latest
            gcp.tags=ghcr.io/spacelift-io/runner-opentofu:gcp-${{ needs.get-tag.outputs.latest_tag }}
            gcp-fips.tags=${{ secrets.PUBLIC_RUNNER_OPENTOFU_ECR_REPOSITORY_URL }}:gcp-latest-fips
            gcp-fips.tags=${{ secrets.PUBLIC_RUNNER_OPENTOFU_ECR_REPOSITORY_URL }}:gcp-${{ needs.get-tag.outputs.latest_tag }}-fips
            gcp-fips.tags=ghcr.io/spacelift-io/runner-opentofu:gcp-latest-fips
            gcp-fips.tags=ghcr.io/spacelift-io/runner-opentofu:gcp-${{ needs.get-tag.outputs.latest_tag }}-fips

  build-azure:
    name: Build and push latest image (w/ az cli)
    runs-on: ubuntu-latest
    needs: get-tag
    permissions:
      id-token: write
      contents: write
      packages: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@main
        with:
          ref: ${{ needs.get-tag.outputs.latest_tag }}
          fetch-depth: 0

      - name: Build and push latest image (w/ az cli)
        uses: ./.github/workflows/publish
        with:
          bake_target: azure,azure-fips
          aws_role_to_assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          bake_set: |
            azure.tags=${{ secrets.PUBLIC_RUNNER_OPENTOFU_ECR_REPOSITORY_URL }}:azure-latest
            azure.tags=${{ secrets.PUBLIC_RUNNER_OPENTOFU_ECR_REPOSITORY_URL }}:azure-${{ needs.get-tag.outputs.latest_tag }}
            azure.tags=ghcr.io/spacelift-io/runner-opentofu:azure-latest
            azure.tags=ghcr.io/spacelift-io/runner-opentofu:azure-${{ needs.get-tag.outputs.latest_tag }}
            azure-fips.tags=${{ secrets.PUBLIC_RUNNER_OPENTOFU_ECR_REPOSITORY_URL }}:azure-latest-fips
            azure-fips.tags=${{ secrets.PUBLIC_RUNNER_OPENTOFU_ECR_REPOSITORY_URL }}:azure-${{ needs.get-tag.outputs.latest_tag }}-fips
            azure-fips.tags=ghcr.io/spacelift-io/runner-opentofu:azure-latest-fips
            azure-fips.tags=ghcr.io/spacelift-io/runner-opentofu:azure-${{ needs.get-tag.outputs.latest_tag }}-fips

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [get-tag, build-aws, build-gcp, build-azure]
    permissions:
      contents: write

    steps:
      - name: Create release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          name: ${{ needs.get-tag.outputs.latest_tag }}
          tag: ${{ needs.get-tag.outputs.latest_tag }}
          generateReleaseNotes: true
          allowUpdates: true
