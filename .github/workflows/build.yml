name: Build

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  deployment:
    strategy:
      matrix:
        target: [aws, gcp, azure]
        platform: [linux/amd64, linux/arm64]
    name: Build the image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@main

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        if: matrix.platform == 'linux/arm64'
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Bake the ${{ matrix.target }} image 
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          targets: ${{ matrix.target }},${{ matrix.target }}-fips
          load: true
          set: |
            ${{ matrix.target }}.tags=runner-opentofu:${{ github.sha }}
            ${{ matrix.target }}.platform=${{ matrix.platform }}
            ${{ matrix.target }}-fips.tags=runner-opentofu:${{ github.sha }}-fips
            ${{ matrix.target }}-fips.platform=${{ matrix.platform }}