name: Build

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  deployment:
    strategy:
      matrix:
        target: [aws, gcp, azure]
        platform: [linux/amd64, linux/arm64]
    name: Build the image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@main

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.platform == 'linux/arm64'
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Bake the ${{ matrix.target }} image 
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          targets: ${{ matrix.target }},${{ matrix.target }}-fips
          load: true
          set: |
            ${{ matrix.target }}.tags=runner-opentofu:${{ github.sha }}
            ${{ matrix.target }}.platform=${{ matrix.platform }}
            ${{ matrix.target }}-fips.tags=runner-opentofu:${{ github.sha }}-fips
            ${{ matrix.target }}-fips.platform=${{ matrix.platform }}